<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0425"/>
      <stop offset="0.45" stop-color="#2a0b5e"/>
      <stop offset="0.64" stop-color="#7a1a8c"/>
      <stop offset="0.645" stop-color="#140630"/>
      <stop offset="1" stop-color="#07021a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="0.45" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff2d95"/>
    </linearGradient>
    <linearGradient id="gridFade" gradientUnits="userSpaceOnUse" x1="0" y1="330" x2="0" y2="512">
      <stop offset="0" stop-color="#ff3fd8" stop-opacity="0.25"/>
      <stop offset="0.35" stop-color="#ff3fd8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ff4ff" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="chipBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c0b3d"/>
      <stop offset="1" stop-color="#0a0320"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ff4ff"/>
      <stop offset="0.5" stop-color="#b44bff"/>
      <stop offset="1" stop-color="#ff3fd8"/>
    </linearGradient>
    <linearGradient id="pixel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ffaff"/>
      <stop offset="1" stop-color="#ff5fe0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#ff3fd8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff3fd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="512" height="512" rx="112"/></clipPath>
    <clipPath id="sunClip">
        <rect x="0" y="0.0" width="512" height="150.0"/>
        <rect x="0" y="153.0" width="512" height="15.9"/>
        <rect x="0" y="173.9" width="512" height="13.2"/>
        <rect x="0" y="194.2" width="512" height="10.6"/>
        <rect x="0" y="213.8" width="512" height="7.8"/>
        <rect x="0" y="232.6" width="512" height="5.2"/>
        <rect x="0" y="250.8" width="512" height="2.4"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#ffffff">
      <circle cx="70" cy="60" r="1.6" opacity=".8"/><circle cx="140" cy="110" r="1.1" opacity=".6"/>
      <circle cx="420" cy="70" r="1.8" opacity=".9"/><circle cx="360" cy="40" r="1" opacity=".5"/>
      <circle cx="455" cy="150" r="1.2" opacity=".6"/><circle cx="48" cy="170" r="1.3" opacity=".6"/>
      <circle cx="210" cy="36" r="1" opacity=".5"/><circle cx="300" cy="95" r="0.9" opacity=".4"/>
    </g>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- retro sun -->
    <circle cx="256" cy="205" r="164" fill="#ff5a9e" opacity=".35" filter="url(#blur)"/>
    <g clip-path="url(#sunClip)">
      <circle cx="256" cy="205" r="150" fill="url(#sun)"/>
    </g>
    <!-- floor -->
    <rect y="330" width="512" height="182" fill="#0c0327"/>
    <g stroke="url(#gridFade)" stroke-width="2.4" filter="url(#softGlow)">
