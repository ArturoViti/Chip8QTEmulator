      <rect x="213.5" y="296.5" width="19" height="19" rx="2"/>
      <rect x="235.5" y="296.5" width="19" height="19" rx="2"/>
      <rect x="257.5" y="296.5" width="19" height="19" rx="2"/>
      <rect x="279.5" y="296.5" width="19" height="19" rx="2"/>
