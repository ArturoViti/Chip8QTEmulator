      <line x1="310.0" y1="330" x2="676" y2="512"/>
      <line x1="319.0" y1="330" x2="746" y2="512"/>
      <line x1="328.0" y1="330" x2="816" y2="512"/>
      <line x1="337.0" y1="330" x2="886" y2="512"/>
      <line x1="346.0" y1="330" x2="956" y2="512"/>
      <line x1="355.0" y1="330" x2="1026" y2="512"/>
      <line x1="364.0" y1="330" x2="1096" y2="512"/>
      <line x1="0" y1="334.0" x2="512" y2="334.0"/>
      <line x1="0" y1="339.5" x2="512" y2="339.5"/>
      <line x1="0" y1="347.1" x2="512" y2="347.1"/>
