      <line x1="0" y1="510.5" x2="512" y2="510.5"/>
      <line x1="0" y1="583.1" x2="512" y2="583.1"/>
    </g>
    <line x1="0" y1="330" x2="512" y2="330" stroke="#ff7be5" stroke-width="3" filter="url(#softGlow)"/>

    <!-- CHIP -->
